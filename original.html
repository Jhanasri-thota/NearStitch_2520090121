<!DOCTYPE html>
<html lang="en">
<head>

<!-- ================================================= -->
<!-- CO1 – HTML Structure + Internet Fundamentals -->
<!-- ================================================= -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NearStitch – Tailoring Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* ================================================= */
/* CO1 – CSS Styling */
/* ================================================= */

:root{
--primary:#f472b6;
--secondary:#fbcfe8;
--accent:#ec4899;
--bg:#fff1f5;
--text:#3f3f46;
--card:#ffffff;
}

body.dark{
--bg:#111827;
--text:#f9fafb;
--card:#1f2937;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:var(--bg);
color:var(--text);
transition:.3s;
}

/* ================================================= */
/* CO2 – Layout (Flexbox + Responsive) */
/* ================================================= */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:var(--card);
box-shadow:0 10px 30px rgba(0,0,0,.05);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:26px;
font-weight:700;
background:linear-gradient(45deg,#ec4899,#f472b6);
-webkit-background-clip:text;
color:transparent;
}

.hero{
text-align:center;
padding:140px 20px;
background:linear-gradient(135deg,#fbcfe8,#f9a8d4);
}

.hero h1{
font-size:42px;
margin-bottom:10px;
}

.hero input{
padding:12px;
border-radius:25px;
border:none;
width:260px;
}

button{
background:#ec4899;
color:white;
border:none;
padding:12px 25px;
border-radius:25px;
cursor:pointer;
margin:10px;
}

.section{
padding:60px 8%;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:var(--card);
padding:25px;
border-radius:18px;
box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.hidden{display:none}

/* Dashboard vertical layout */

.dashboard-list{
display:flex;
flex-direction:column;
gap:15px;
margin-top:20px;
}

.dashboard-item{
background:var(--card);
padding:20px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.progress{
height:8px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.progress div{
height:100%;
background:#ec4899;
width:0%;
}

.gallery img{
width:100%;
border-radius:10px;
margin-top:10px;
}

#toast{
position:fixed;
bottom:30px;
right:30px;
background:#ec4899;
color:white;
padding:12px 20px;
border-radius:10px;
display:none;
}

footer{
text-align:center;
padding:40px;
}

</style>
</head>

<body>

<nav>

<div class="logo">NearStitch</div>

<div>
<button onclick="toggleTheme()">🌙</button>
<button onclick="logout()">Logout</button>
</div>

</nav>

<!-- HERO -->

<section class="hero">

<h1>We Stitch Designs that Fit You Perfectly</h1>

<p>Find nearby professional tailors with pickup & delivery.</p>

<input id="location" placeholder="Enter your location">

<br>

<button onclick="searchTailors()">Find Tailors</button>
<button onclick="showAuth()">Get Started</button>

</section>

<!-- SEARCH RESULTS -->

<div id="results" class="section hidden">

<h2>Nearby Tailors</h2>

<div class="cards" id="shopList"></div>

</div>

<!-- TAILOR PROFILE -->

<div id="profile" class="section hidden"></div>

<!-- AUTH -->

<div id="auth" class="section hidden">

<h2>Login / Register</h2>

<select id="role">
<option value="customer">Customer</option>
<option value="tailor">Tailor</option>
<option value="admin">Admin</option>
</select>

<input id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Continue</button>

</div>

<!-- DASHBOARD -->

<div id="dashboard" class="section hidden"></div>

<div id="toast">Booking Confirmed!</div>

<footer>
<p>© 2026 NearStitch</p>
</footer>

<script>

/* ================================================= */
/* CO3 – JavaScript Fundamentals */
/* ================================================= */

let shops=[
{name:"Elite Stitch Studio",rating:4.8,delivery:3},
{name:"Classic Cuts Tailors",rating:4.6,delivery:2},
{name:"Royal Tailors",rating:4.7,delivery:4}
]

function toggleTheme(){
document.body.classList.toggle("dark")
}

/* ================================================= */
/* CO4 – DOM Manipulation */
/* ================================================= */

function searchTailors(){

let location=document.getElementById("location").value

if(location===""){
alert("Enter location")
return
}

document.getElementById("results").classList.remove("hidden")

let html=""

shops.forEach((s,i)=>{

html+=`

<div class="card">

<h3>${s.name}</h3>

<p>⭐ ${s.rating}</p>

<p>Delivery ${s.delivery} days</p>

<button onclick="viewShop(${i})">View Details</button>

</div>

`

})

document.getElementById("shopList").innerHTML=html

}

/* Tailor profile */

function viewShop(i){

let shop=shops[i]

document.getElementById("profile").classList.remove("hidden")

document.getElementById("profile").innerHTML=`

<h2>${shop.name}</h2>

<p>Rating ⭐${shop.rating}</p>

<p>Delivery ${shop.delivery} days</p>

<h3>Services</h3>

<ul>
<li>Blouse ₹500</li>
<li>Kurti ₹700</li>
<li>Suit ₹1200</li>
</ul>

<h3>Portfolio</h3>

<div class="gallery">
<img src="https://images.unsplash.com/photo-1593032465171-8b7e8f2d1c3f">
<img src="https://images.unsplash.com/photo-1593032465171-8b7e8f2d1c3f">
</div>

<button onclick="renderCustomer()">Book Now</button>

`

}

/* ================================================= */
/* AUTHENTICATION */
/* ================================================= */

function showAuth(){
document.getElementById("auth").classList.remove("hidden")
}

function login(){

let role=document.getElementById("role").value

localStorage.setItem("currentUser",role)

loadDashboard(role)

}

function logout(){
localStorage.clear()
location.reload()
}

/* ================================================= */
/* CUSTOMER DASHBOARD */
/* ================================================= */

function renderCustomer(){

document.getElementById("dashboard").classList.remove("hidden")

document.getElementById("dashboard").innerHTML=`

<h2>Customer Dashboard</h2>

<div class="dashboard-list">

<div class="dashboard-item">

<h3>Select Service</h3>

<select id="service">
<option value="500">Blouse ₹500</option>
<option value="700">Kurti ₹700</option>
<option value="1200">Suit ₹1200</option>
</select>

</div>

<div class="dashboard-item">
<label>Urgent Delivery (+200)</label>
<input type="checkbox" id="urgent">
</div>

<div class="dashboard-item">
<label>Pickup Date</label>
<input type="date">
</div>

<div class="dashboard-item">
<label>Pickup Time</label>
<select>
<option>10 AM</option>
<option>2 PM</option>
<option>6 PM</option>
</select>
</div>

<div class="dashboard-item">
<label>Upload Measurement</label>
<input type="file">
</div>

<div class="dashboard-item">

<h3>Total ₹<span id="total">500</span></h3>

<button onclick="book()">Book Now</button>

</div>

</div>

`

updatePrice()

document.getElementById("service").onchange=updatePrice
document.getElementById("urgent").onchange=updatePrice

}

/* Price calculator */

function updatePrice(){

let base=parseInt(document.getElementById("service").value)
let urgent=document.getElementById("urgent").checked?200:0

document.getElementById("total").innerText=base+urgent

}

/* Booking */

function book(){

let toast=document.getElementById("toast")

toast.style.display="block"

setTimeout(()=>toast.style.display="none",3000)

}

/* ================================================= */
/* TAILOR DASHBOARD */
/* ================================================= */

function renderTailor(){

document.getElementById("dashboard").classList.remove("hidden")

document.getElementById("dashboard").innerHTML=`

<h2>Tailor Dashboard</h2>

<div class="dashboard-list">

<div class="dashboard-item">Pending Orders: 5</div>

<div class="dashboard-item">Update Order Status</div>

<div class="dashboard-item">Manage Services</div>

<div class="dashboard-item">View Earnings</div>

</div>

`

}

/* ================================================= */
/* ADMIN PANEL */
/* ================================================= */

function renderAdmin(){

document.getElementById("dashboard").classList.remove("hidden")

document.getElementById("dashboard").innerHTML=`

<h2>Admin Panel</h2>

<div class="dashboard-list">

<div class="dashboard-item">Total Users: 120</div>

<div class="dashboard-item">Total Orders: 340</div>

<div class="dashboard-item">
<canvas id="chart"></canvas>
</div>

</div>

`

new Chart(document.getElementById("chart"),{
type:'bar',
data:{
labels:['Users','Orders'],
datasets:[{data:[120,340]}]
}
})

}

/* Router */

function loadDashboard(role){

if(role==="customer")renderCustomer()
if(role==="tailor")renderTailor()
if(role==="admin")renderAdmin()

}

window.onload=function(){

let user=localStorage.getItem("currentUser")

if(user){
loadDashboard(user)
}

}

</script>

</body>
</html>
